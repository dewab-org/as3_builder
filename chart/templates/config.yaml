{{- if .Values.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "as3-builder.fullname" . }}-env
  labels:
    {{- include "as3-builder.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.configJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "as3-builder.fullname" . }}-config
  labels:
    {{- include "as3-builder.labels" . | nindent 4 }}
data:
  as3b-config.json: |-
    {{- .Values.configJson | nindent 4 }}
{{- end }}
