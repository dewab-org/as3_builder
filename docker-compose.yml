services:
  as3-builder:
    # The published image — `docker compose pull` updates it. To run a local
    # build instead, use docker-compose.testing.yml, which builds from this
    # checkout with the same wiring.
    image: ghcr.io/dewab-org/as3_builder:latest
    ports:
      # Loopback only: the proxy routes reach any BIG-IP or NetBox the
      # container can route to, and with AS3B_EXPOSE_CREDENTIALS set the page
      # hands out whatever is in .env — don't publish this wider by accident.
      # 8088 on the host because NetBox itself commonly sits on 8080.
      - "127.0.0.1:8088:8080"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The server writes nothing; /tmp exists only so Node always has a scratch
    # path, and it is small, noexec and nosuid.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # Connection defaults for the dialogs. Optional: without a .env the app
    # still runs, the dialogs just start empty.
    env_file:
      - path: .env
        required: false
    # Deployment support policy (feature gates, unsupported classes).
    # Uncomment to mount one; see as3b-config.example.json.
    # volumes:
    #   - ./as3b-config.json:/app/as3b-config.json:ro
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Hand the passwords/token from .env to the page, the way the dev server
      # does. A deployed server withholds them by default — anyone who can
      # reach this port gets whatever is exposed here, which is why the port
      # binding above stays on loopback.
      AS3B_EXPOSE_CREDENTIALS: "1"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
